<div class="relative min-h-screen flex flex-col bg-[#070a12] text-slate-100 overflow-x-hidden">
  <!-- Atmospheric Interactive Particle & Grid Canvas -->
  <app-atmospheric-background></app-atmospheric-background>

  <!-- Global Toast Notifications Stack -->
  <app-toast-container></app-toast-container>

  <div class="relative z-10 flex h-screen overflow-hidden">
    <!-- Desktop Persistent Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Application Column -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      <!-- Top Navigation & Status Bar -->
      <app-topbar></app-topbar>

      <!-- Scrollable or Fixed Viewport Router Outlet -->
      <main class="flex-1 overflow-y-auto overflow-x-hidden pb-16 lg:pb-0 relative">
        <router-outlet></router-outlet>
      </main>

      <!-- Mobile Bottom Navigation Bar -->
      <nav class="lg:hidden fixed bottom-0 left-0 right-0 h-16 bg-[#0b101d]/95 backdrop-blur-md border-t border-slate-800 flex items-center justify-around z-30 px-2">
        <a 
          routerLink="/dashboard" 
          routerLinkActive="text-cyan-400 font-bold"
          class="flex flex-col items-center gap-1 text-[10px] font-mono text-slate-400 hover:text-white py-1"
        >
          <span class="material-icons text-lg">space_dashboard</span>
          <span>Dash</span>
        </a>

        <a 
          routerLink="/forge" 
          routerLinkActive="text-cyan-400 font-bold"
          class="flex flex-col items-center gap-1 text-[10px] font-mono text-slate-400 hover:text-white py-1"
        >
          <span class="material-icons text-lg">hardware</span>
          <span>Forge</span>
        </a>

        <a 
          routerLink="/code" 
          routerLinkActive="text-cyan-400 font-bold"
          class="flex flex-col items-center gap-1 text-[10px] font-mono text-slate-400 hover:text-white py-1"
        >
          <span class="material-icons text-lg">terminal</span>
          <span>Code</span>
        </a>

        <a 
          routerLink="/simulation" 
          routerLinkActive="text-cyan-400 font-bold"
          class="flex flex-col items-center gap-1 text-[10px] font-mono text-slate-400 hover:text-white py-1"
        >
          <span class="material-icons text-lg">smart_toy</span>
          <span>Sim</span>
        </a>

        <a 
          routerLink="/challenges" 
          routerLinkActive="text-cyan-400 font-bold"
          class="flex flex-col items-center gap-1 text-[10px] font-mono text-slate-400 hover:text-white py-1"
        >
          <span class="material-icons text-lg">flag</span>
          <span>Missions</span>
        </a>
      </nav>
    </div>
  </div>
</div>
